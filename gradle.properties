# JVM options for the Gradle build process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the JDK 21 bundled with Android Studio (the system default JDK 26 is too new
# for the Android build tools). Update this path if Android Studio moves.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# AndroidX is the modern support library namespace.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official
